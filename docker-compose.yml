version: '3.8' # Use a recent stable version

services:

  # --- Orchestrator (EEP) ---
  eep_ui:
    build:
      context: .
      dockerfile: ./EEP/Dockerfile
    image: hmiskawi/eep-ui:latest # Optional: Use pre-built image name
    container_name: eep_ui_service
    restart: unless-stopped
    ports:
      - "5050:5050"
    networks:
      - xgen_network
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      - caption_generator
      - hashtag_generator
      - image_generator
      - keyword_suggester
      - past_tweet_analyzer
      - trend_analyzer
      - computer_vision
      - filter
      - engagement_prediction

  # --- Generation IEPs ---
  caption_generator:
    build:
      context: .
      dockerfile: ./IEP/caption-generator/Dockerfile
    image: hmiskawi/caption-generator-iep:latest
    container_name: caption_generator_iep
    restart: unless-stopped
    environment:
      # GOOGLE_API_KEY is read from the .env file in the same directory as docker-compose.yml
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "5001:5001" # Host:Container
    networks:
      - xgen_network

  hashtag_generator:
    build:
      context: .
      dockerfile: ./IEP/hashtag-generator/Dockerfile
    image: hmiskawi/hashtag-generator-iep:latest
    container_name: hashtag_generator_iep
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "5002:5002"
    networks:
      - xgen_network

  image_generator:
    build:
      context: .
      dockerfile: ./IEP/image-generator/Dockerfile
    image: hmiskawi/image-generator-iep:latest
    container_name: image_generator_iep
    restart: unless-stopped
    environment:
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME}
    ports:
      - "5003:5003"
    networks:
      - xgen_network

  keyword_suggester:
    build:
      context: .
      dockerfile: ./IEP/keyword-suggester/Dockerfile
    image: hmiskawi/keyword-suggester-iep:latest
    container_name: keyword_suggester_iep
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "5004:5004"
    networks:
      - xgen_network

  # --- Analysis IEPs ---
  past_tweet_analyzer:
    build:
      context: .
      dockerfile: ./IEP/past-tweet-analyzer/Dockerfile
    image: hmiskawi/past-tweet-analyzer-iep:latest
    container_name: past_tweet_analyzer_iep
    restart: unless-stopped
    environment:
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
    ports:
      - "5005:5005"
    networks:
      - xgen_network

  trend_analyzer:
    build:
      context: .
      dockerfile: ./IEP/trend-analyzer/Dockerfile
    image: hmiskawi/trend-analyzer-iep:latest
    container_name: trend_analyzer_iep
    restart: unless-stopped
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
    ports:
      - "5006:5006"
    networks:
      - xgen_network

  computer_vision:
    build:
      context: .
      dockerfile: ./IEP/computer-vision/Dockerfile
    image: hmiskawi/computer-vision-iep:latest # Recommended to add image name
    container_name: computer_vision_iep
    restart: unless-stopped
    ports:
      - "5021:5021"
    networks:
      - xgen_network

  # --- Utility IEPs ---
  filter:
    build:
      context: .
      dockerfile: ./IEP/filter/Dockerfile
    image: hmiskawi/filter-iep:latest # Recommended to add image name
    container_name: filter_iep
    restart: unless-stopped
    ports:
      - "5022:5022"
    networks:
      - xgen_network

  engagement_prediction:
    build:
      context: .
      dockerfile: ./IEP/engagement-prediction/Dockerfile
    image: hmiskawi/engagement-prediction-iep:latest # Recommended to add image name
    container_name: engagement_prediction_iep
    restart: unless-stopped
    # Models are copied in the Dockerfile now.
    # Add environment variables if needed (e.g., override model paths if desired)
    # environment:
    #   - LGBM_MODEL_PATH=/models/other_model.pkl
    ports:
      - "5010:5010"
    networks:
      - xgen_network

# Define a common network for all services
networks:
  xgen_network:
    driver: bridge

# --- Important Notes ---
# 1. This file assumes a ".env" file exists in the same directory (X-Content-Generation/)
#    to provide values for ${GOOGLE_API_KEY}, ${STABILITY_API_KEY}, etc.
# 2. Create local "./output" and "./input" directories in X-Content-Generation/ before running.
# 3. Run the EEP orchestrator using:
#    docker-compose run --rm eep <username> [options: --keyword <kw> --image_path /input/img.jpg --num_captions <n>]